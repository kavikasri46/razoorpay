version: "3.9"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: razorpay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: razorpay_secret
      POSTGRES_DB: razorpay
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend Server
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: razorpay_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:razorpay_secret@db:5432/razorpay?schema=public
      JWT_SECRET: your_jwt_secret_change_this_in_production
      PORT: 5000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # React Frontend (Nginx)
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: razorpay_frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
