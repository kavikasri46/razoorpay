version: "3.9"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: laserpay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: laserpay_secret
      POSTGRES_DB: laserpay
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: laserpay_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:laserpay_secret@db:5432/laserpay?schema=public
      JWT_SECRET: your_jwt_secret_change_this_in_production
      PORT: 5000
      # Optional: Add Groq key for AI features
      # GROQ_API_KEY: your_groq_api_key
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # React Frontend (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: laserpay_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
